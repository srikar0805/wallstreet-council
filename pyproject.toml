[project]
name = "wallstreet-council"
version = "0.1.0"
description = "A council of AI models (Gemini, NVIDIA, Codex, Claude) that debate stock picks live, as a paper-trading MCP server"
readme = "README.md"
authors = [
    { name = "srikar0805", email = "saisrikarreddy.k20@iiits.in" }
]
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "mcp>=2.2,<3",
    "pypdf>=6.19.0",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
    "vadersentiment>=3.3.2",
    "yfinance>=1.7.0",
]

[project.scripts]
council = "wallstreet_council.cli:main"
wallstreet-council-mcp = "wallstreet_council.server:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
